<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khalifa AI | Premium Image Generation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #06090f;
            --bg-panel: #0d1117;
            --accent-green: #238636;
            --accent-glow: rgba(35, 134, 54, 0.3);
            --border: #30363d;
            --text-gray: #8b949e;
        }
        body { background: var(--bg-dark); color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
        
        /* Navbar & Branding */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 50px; background: var(--bg-panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .logo-group { display: flex; align-items: center; gap: 12px; }
        .nav-logo { height: 38px; border-radius: 6px; box-shadow: 0 0 10px var(--accent-glow); }
        .nav-title { font-size: 1.4rem; font-weight: 800; letter-spacing: 2px; background: linear-gradient(to right, #fff, #8b949e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-actions { display: flex; gap: 15px; align-items: center; }
        
        /* Professional Buttons */
        .btn { padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); transition: 0.2s; text-decoration: none; font-size: 0.9rem; }
        .btn-admin { background: transparent; color: var(--text-gray); }
        .btn-login { background: #21262d; color: white; }
        .btn-buy { background: var(--accent-green); color: white; border: none; }
        .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }

        /* Generator Workspace */
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .workspace { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .engine-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .credits-badge { background: rgba(35, 134, 54, 0.1); color: var(--accent-green); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--accent-green); font-size: 0.85rem; font-weight: bold; }

        .prompt-area { width: 100%; height: 120px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; color: white; padding: 18px; font-size: 1.1rem; box-sizing: border-box; resize: none; margin-bottom: 20px; transition: border 0.3s; }
        .prompt-area:focus { outline: none; border-color: var(--accent-green); }

        .controls { display: flex; justify-content: space-between; align-items: center; }
        .model-picker { background: var(--bg-dark); color: white; border: 1px solid var(--border); padding: 12px; border-radius: 6px; width: 250px; }
        .btn-generate { background: var(--accent-green); color: white; border: none; padding: 14px 40px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; display: flex; gap: 10px; align-items: center; }

        /* Output & Privacy Console */
        .output-box { margin-top: 30px; height: 450px; background: var(--bg-dark); border: 1px dashed var(--border); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .privacy-alert { position: absolute; top: 15px; right: 15px; font-size: 0.75rem; color: #58a6ff; display: flex; align-items: center; gap: 5px; opacity: 0.7; }

        /* Community Highlights */
        .gallery-title { margin-top: 60px; border-bottom: 1px solid var(--border); padding-bottom: 10px; font-size: 1.5rem; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 25px; }
        .gallery-card { background: var(--bg-panel); height: 260px; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: #484f58; font-style: italic; }
    </style>
</head>
